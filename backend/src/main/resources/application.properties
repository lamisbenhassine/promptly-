# ===================================================================
#  Promptly - configuration du backend Spring Boot
# ===================================================================

spring.application.name=Promptly
promptly.application.version=0.0.1-SNAPSHOT

# Secrets locaux (token HF, etc.) — fichier gitignore, optionnel.
spring.config.import=optional:classpath:application-local.properties

# ------------------------- Serveur HTTP ----------------------------
server.port=8080

# ------------------------ Base de donnees --------------------------
# Les identifiants ne sont JAMAIS ecrits en dur : ils sont lus depuis des
# variables d'environnement Windows. La syntaxe ${VARIABLE:valeur_par_defaut}
# fournit une valeur de repli si la variable n'est pas definie.
spring.datasource.url=jdbc:mysql://localhost:3306/promptly_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${PROMPTLY_DB_USER:root}
spring.datasource.password=${PROMPTLY_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Delai avant d'abandonner l'ouverture d'une connexion (5 s au lieu de 30 s
# par defaut) : en developpement, on veut une erreur rapide et lisible.
spring.datasource.hikari.connection-timeout=5000

# --------------------------- JPA / Hibernate -----------------------
# "update" : Hibernate cree et met a jour les tables a partir des entites Java.
# Pratique en developpement. A remplacer par "validate" + migrations Flyway
# dans un contexte de production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Le dialecte n'est pas declare explicitement : Hibernate le deduit de la
# connexion JDBC (le declarer provoque l'avertissement HHH90000025).

# Evite de garder une session Hibernate ouverte pendant le rendu de la reponse.
spring.jpa.open-in-view=false

# ------------------------------ CORS -------------------------------
# Origines autorisees a appeler l'API (le serveur de developpement Angular).
promptly.cors.allowed-origins=http://localhost:4200

# ------------------------------- JWT -------------------------------
# La cle de signature n'est JAMAIS ecrite ici : elle est lue depuis une
# variable d'environnement. Elle doit faire au moins 32 caracteres
# (contrainte de l'algorithme HMAC-SHA256), sans quoi l'application refuse
# de demarrer avec un message explicite.
promptly.jwt.secret=${PROMPTLY_JWT_SECRET:}

# Duree de validite d'un jeton : 24 heures (en millisecondes).
# Compromis entre confort d'usage et limitation de la fenetre d'exploitation
# en cas de vol du jeton. Aucun mecanisme de revocation n'est implemente :
# un jeton vole reste valide jusqu'a son expiration (limite documentee).
promptly.jwt.expiration-ms=86400000

# --------------------------- Ollama (IA) ---------------------------
# Resume automatique des PDF. Ollama doit tourner en local.
promptly.ollama.base-url=${PROMPTLY_OLLAMA_BASE_URL:http://localhost:11434}
promptly.ollama.model=${PROMPTLY_OLLAMA_MODEL:llama3.2:3b}
promptly.ollama.timeout-seconds=180
# Nombre max de caracteres envoyes au modele (troncature du PDF).
promptly.ai.max-pdf-chars=12000

# --------------- Integrite quiz (ML guess vs know) -----------------
# Micro-service Python (ml-integrity) : predit si l'etudiant a repondu
# au hasard (GUESS) ou en connaissance de cause (KNOW).
promptly.integrity.enabled=${PROMPTLY_INTEGRITY_ENABLED:true}
promptly.integrity.base-url=${PROMPTLY_INTEGRITY_BASE_URL:http://localhost:8090}

# --------------- Reclamations (ML type / urgence / priorite) -------
# Micro-service Python (ml-complaints) : classifie la reclamation.
# Visible uniquement cote admin.
promptly.complaints-ml.enabled=${PROMPTLY_COMPLAINTS_ML_ENABLED:true}
promptly.complaints-ml.base-url=${PROMPTLY_COMPLAINTS_ML_BASE_URL:http://localhost:8091}

# --------------- Emotion reclamations (backend Spring) ------------
# Token HF : uniquement dans application-local.properties (gitignore)
# ou variable d'env PROMPTLY_EMOTION_HF_TOKEN (ne pas le mettre ici :
# une valeur vide ici ecraserait le fichier local).
promptly.emotion.enabled=${PROMPTLY_EMOTION_ENABLED:true}
promptly.emotion.hf-model=${PROMPTLY_EMOTION_HF_MODEL:j-hartmann/emotion-english-distilroberta-base}

# --------------- Matching CV / offre (Gemini gratuit) -------------
# Cle gratuite : https://aistudio.google.com/apikey
# Mettre promptly.cv-match.api-key dans application-local.properties
promptly.cv-match.enabled=${PROMPTLY_CV_MATCH_ENABLED:true}
promptly.cv-match.api-key=${PROMPTLY_CV_MATCH_API_KEY:}
promptly.cv-match.gemini-model=${PROMPTLY_CV_MATCH_GEMINI_MODEL:gemini-2.0-flash}
promptly.cv-match.gemini-url=${PROMPTLY_CV_MATCH_GEMINI_URL:https://generativelanguage.googleapis.com}

# --------------- Forum : filtre gros mots (Sightengine) -----------
# Compte gratuit : https://dashboard.sightengine.com/signup
# Puis API keys : https://dashboard.sightengine.com/api-credentials
# Mettre api-user + api-secret dans application-local.properties uniquement.
promptly.profanity.enabled=${PROMPTLY_PROFANITY_ENABLED:true}
promptly.profanity.base-url=${PROMPTLY_PROFANITY_BASE_URL:https://api.sightengine.com}

# --------------- Forum : auto-correction (API + token) ------------
# TextGears (gratuit avec cle) : https://textgears.com/signup.php
# Mettre la cle dans application-local.properties :
#   promptly.spellcheck.api-key=VOTRE_CLE
#
# Option Azure Bing Spell Check F0 :
#   promptly.spellcheck.provider=bing
#   promptly.spellcheck.api-key=AZURE_KEY
promptly.spellcheck.enabled=${PROMPTLY_SPELLCHECK_ENABLED:true}
promptly.spellcheck.provider=${PROMPTLY_SPELLCHECK_PROVIDER:textgears}
promptly.spellcheck.language=${PROMPTLY_SPELLCHECK_LANGUAGE:fr-FR}
promptly.spellcheck.api-key=${PROMPTLY_SPELLCHECK_API_KEY:}
promptly.spellcheck.textgears-url=${PROMPTLY_SPELLCHECK_TG_URL:https://api.textgears.com}

# ------------------------- Google Sign-In --------------------------
# Client ID OAuth 2.0 (type "Application Web") cree dans Google Cloud Console.
# Le frontend utilise la meme valeur (environment.googleClientId).
# Laisser vide desactive la connexion Google cote API.
promptly.google.client-id=${PROMPTLY_GOOGLE_CLIENT_ID:}

# ------------------- Compte administrateur initial -----------------
# Cree au premier demarrage si aucun administrateur actif n'existe.
# Si ces variables ne sont pas definies, aucun compte n'est cree : il serait
# dangereux de creer un administrateur avec un mot de passe par defaut connu.
promptly.admin.email=${PROMPTLY_ADMIN_EMAIL:}
promptly.admin.password=${PROMPTLY_ADMIN_PASSWORD:}
promptly.admin.first-name=${PROMPTLY_ADMIN_FIRST_NAME:Admin}
promptly.admin.last-name=${PROMPTLY_ADMIN_LAST_NAME:Promptly}

# --------------------------- Fichiers uploades ---------------------
# Dossier local (hors Git) pour les images et PDF. Les chemins relatifs sont
# stockes en base ; les binaires restent sur le disque.
promptly.upload-dir=uploads

# Limites multipart (Spring Boot 3)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ----------------------------- Journaux ----------------------------
logging.level.com.promptly.backend=DEBUG
