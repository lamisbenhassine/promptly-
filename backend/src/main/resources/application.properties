# ===================================================================
#  Promptly - configuration du backend Spring Boot
# ===================================================================

spring.application.name=Promptly
promptly.application.version=0.0.1-SNAPSHOT

# ------------------------- Serveur HTTP ----------------------------
server.port=8080

# ------------------------ Base de donnees --------------------------
# Les identifiants ne sont JAMAIS ecrits en dur : ils sont lus depuis des
# variables d'environnement Windows. La syntaxe ${VARIABLE:valeur_par_defaut}
# fournit une valeur de repli si la variable n'est pas definie.
spring.datasource.url=jdbc:mysql://localhost:3306/promptly_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${PROMPTLY_DB_USER:root}
spring.datasource.password=${PROMPTLY_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Delai avant d'abandonner l'ouverture d'une connexion (5 s au lieu de 30 s
# par defaut) : en developpement, on veut une erreur rapide et lisible.
spring.datasource.hikari.connection-timeout=5000

# --------------------------- JPA / Hibernate -----------------------
# "update" : Hibernate cree et met a jour les tables a partir des entites Java.
# Pratique en developpement. A remplacer par "validate" + migrations Flyway
# dans un contexte de production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Le dialecte n'est pas declare explicitement : Hibernate le deduit de la
# connexion JDBC (le declarer provoque l'avertissement HHH90000025).

# Evite de garder une session Hibernate ouverte pendant le rendu de la reponse.
spring.jpa.open-in-view=false

# ------------------------------ CORS -------------------------------
# Origines autorisees a appeler l'API (le serveur de developpement Angular).
promptly.cors.allowed-origins=http://localhost:4200

# ------------------------------- JWT -------------------------------
# La cle de signature n'est JAMAIS ecrite ici : elle est lue depuis une
# variable d'environnement. Elle doit faire au moins 32 caracteres
# (contrainte de l'algorithme HMAC-SHA256), sans quoi l'application refuse
# de demarrer avec un message explicite.
promptly.jwt.secret=${PROMPTLY_JWT_SECRET:}

# Duree de validite d'un jeton : 24 heures (en millisecondes).
# Compromis entre confort d'usage et limitation de la fenetre d'exploitation
# en cas de vol du jeton. Aucun mecanisme de revocation n'est implemente :
# un jeton vole reste valide jusqu'a son expiration (limite documentee).
promptly.jwt.expiration-ms=86400000

# ------------------- Compte administrateur initial -----------------
# Cree au premier demarrage si aucun administrateur actif n'existe.
# Si ces variables ne sont pas definies, aucun compte n'est cree : il serait
# dangereux de creer un administrateur avec un mot de passe par defaut connu.
promptly.admin.email=${PROMPTLY_ADMIN_EMAIL:}
promptly.admin.password=${PROMPTLY_ADMIN_PASSWORD:}
promptly.admin.first-name=${PROMPTLY_ADMIN_FIRST_NAME:Admin}
promptly.admin.last-name=${PROMPTLY_ADMIN_LAST_NAME:Promptly}

# ----------------------------- Journaux ----------------------------
logging.level.com.promptly.backend=DEBUG
