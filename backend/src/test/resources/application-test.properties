# ===================================================================
#  Configuration des tests d'integration
#
#  Une base H2 en memoire remplace MySQL : les tests ne dependent donc
#  d'aucun serveur externe et n'alterent jamais les donnees reelles.
#  Le schema est recree puis supprime a chaque execution.
# ===================================================================

spring.datasource.url=jdbc:h2:mem:promptly_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cle de signature propre aux tests (32 caracteres minimum).
# Il s'agit d'une valeur de test sans aucune valeur de production.
promptly.jwt.secret=cle-de-test-promptly-uniquement-pour-les-tests-automatises
promptly.jwt.expiration-ms=3600000

# AdminInitializer est neutralise dans les tests par @Profile("!test"), et non
# par ces proprietes : les variables d'environnement du poste de developpement
# (PROMPTLY_ADMIN_EMAIL) ont une priorite superieure a ce fichier et
# reprendraient le dessus. Les tests creent eux-memes l'administrateur dont ils
# ont besoin, ce qui rend leur etat initial explicite et reproductible.
promptly.admin.email=
promptly.admin.password=

promptly.cors.allowed-origins=http://localhost:4200

# Pas de Client ID Google en tests : l'endpoint renvoie une erreur metier claire.
promptly.google.client-id=

logging.level.com.promptly.backend=WARN
