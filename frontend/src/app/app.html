<div
  class="shell"
  [class.shell--auth]="isAuthShell()"
  [class.shell--sidebar-open]="!isAuthShell() && sidebarOpen()">

  @if (!isAuthShell()) {
    <app-sidebar
      [links]="links()"
      [open]="sidebarOpen()"
      [showAdmin]="!!isAdmin()"
      (closed)="closeSidebar()" />
  }

  <div class="shell__main">
    @if (!isAuthShell()) {
      <app-navbar
        [sidebarOpen]="sidebarOpen()"
        (menuToggle)="toggleSidebar()" />
    }

    <main [class]="isAuthShell() ? 'auth-shell' : 'main'">
      <router-outlet />
    </main>

    @if (!isAuthShell()) {
      <app-footer />
    }
  </div>
</div>
