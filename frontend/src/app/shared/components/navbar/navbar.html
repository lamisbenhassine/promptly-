<header class="navbar">
  <div class="navbar__inner">

    <a class="brand" routerLink="/">
      <span class="brand__mark">&lt;/&gt;</span>
      <span class="brand__name">Promptly</span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      @for (link of links; track link.path) {
        @if (link.enabled) {
          <a
            class="nav__link"
            [routerLink]="link.path"
            routerLinkActive="nav__link--active"
            [routerLinkActiveOptions]="{ exact: true }">
            {{ link.label }}
          </a>
        } @else {
          <span class="nav__link nav__link--disabled" title="Module a venir">
            {{ link.label }}
          </span>
        }
      }

      @if (isAdmin()) {
        <a class="nav__link" routerLink="/admin/utilisateurs" routerLinkActive="nav__link--active">
          Utilisateurs
        </a>
      }
    </nav>

    <div class="navbar__actions">
      @if (isAuthenticated()) {
        @if (user(); as u) {
          <a class="navbar__user" routerLink="/profil">
            <span class="navbar__name">{{ u.firstName }} {{ u.lastName }}</span>
            <span class="navbar__role">{{ roleLabels[u.role] }}</span>
          </a>
        }
        <button type="button" class="btn btn--ghost btn--small" (click)="logout()">
          Deconnexion
        </button>
      } @else {
        <a class="nav__link" routerLink="/connexion">Connexion</a>
        <a class="btn btn--small" routerLink="/inscription">Inscription</a>
      }
    </div>

  </div>
</header>
